seed: 271828
cpu_threads: 2
domains: [CN, US]
datasets:
  BIO:
    root: data/openalex_bio
  CS:
    root: data/openalex_cs
  MAT:
    root: data/openalex_mat
legacy_config: configs/public_groups.yaml
